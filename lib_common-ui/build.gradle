plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.common.ui'
    compileSdk build_versions.compile_sdk

    defaultConfig {
        minSdk build_versions.min_sdk
        targetSdk build_versions.target_sdk
        versionCode build_versions.sdk_version_code
        versionName build_versions.sdk_version_name

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'proguard-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Library 依然可以使用 Proguard
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures { viewBinding true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'com.google.android.material:material:1.10.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation project(":lib_common-utils")
    implementation project(":lib_common-theme")
  //  api project(":lib_common-share")
    api project(":lib_common-weight")
    // UI 基类可被 AOP 织入，但不向宿主强传递 AOP；需要 AOP 的宿主显式依赖 lib_common-aop。
    compileOnly project(":lib_common-aop")
    compileOnly 'org.aspectj:aspectjrt:1.9.23'

    /*===============================lifecycle============================================*/
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.7.0'
    /*===============================lifecycle============================================*/

}

// Activity 生命周期定义在 UI 基类中，本模块也需要织入，子类继承基类生命周期时才能打印。
// UI 基类依赖 ViewBinding 生成类，需等 JavaCompile 生成 Binding class 后再织入 Kotlin class。
ext.aspectjWeaveConfig = [
        weaveKotlinOnKotlinCompile       : false,
        weaveKotlinOnJavaCompile         : true,
        kotlinClasspathIncludesJavaOutput: true
]
apply from: rootProject.file("gradle/aspectj-weave.gradle")
